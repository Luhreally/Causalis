name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # Far years of the Earth seed, run ahead for this deploy's own rules (Phase 63): the title's "at a
  # year of your choosing" and its way into the ages past ours take them up in seconds, and an alien world
  # past ours by another road with them (Phase 66). Side by side with the tests, for its time (some forty
  # minutes on a runner). Only ever in the deploy, never in the repository.
  bake:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      # (The same history makes the same worlds: kept, for as long as what makes them has not moved.)
      - id: kept
        uses: actions/cache@v4
        with:
          path: universe/baked
          key: baked-${{ hashFiles('universe/src/sim/**', 'universe/src/rules/**', 'universe/src/kernel/**', 'universe/src/gen/**', 'universe/src/host/planet.ts', 'universe/src/host/kinds.ts', 'universe/src/host/past.ts', 'universe/tools/bake.ts', 'universe/public/catalogue.json', 'universe/package-lock.json') }}-1500-2000-3000
      - if: steps.kept.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.kept.outputs.cache-hit != 'true'
        run: node tools/bake.ts --out baked --years 1500,2000,3000
      - uses: actions/upload-artifact@v4
        with:
          name: baked
          path: universe/baked
          retention-days: 1

  deploy:
    needs: [test, bake]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: universe
      - run: npm run build
        working-directory: universe
      - uses: actions/download-artifact@v4
        with:
          name: baked
          path: universe/dist/baked
      - run: cp -r universe/dist dist/client/universe
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
