name: Test

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test

  universe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # The Phase 2 gate: eleven seeds, five hundred years each, every seed in its own process.
      - run: npm run gate:2
      # The Phase 3 gate: the Earth seed nine centuries — its turning points and numbers in
      # their bands, fuel only where deep time buried it, the north star on the industrial
      # planet, every year within budget and the save within bounds.
      - run: npm run gate:3

  universe-diversity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      # The Phase 4 gate's CI check: thirty open-prior worlds for a century and a half
      # (bodies, media, invention orders, houses, arms, growth, budgets), and a sea people
      # coming to power by the tides. The full gate (a hundred worlds, nine centuries) runs
      # locally: npm run gate:4.
      - run: npm run gate:4 -- --ci

  universe-engines:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: sudo apt-get install -y --no-install-recommends libgl1-mesa-dri libglx-mesa0 libegl-mesa0
      - run: npm run engines
      - run: npm run build
      - run: npm run app-check
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
      # CI runners are about half as fast as the reference machine: 2× here is its 4×.
      - run: npm run slice -- 300 2
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
