name: Test

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test

  universe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  universe-engines:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: sudo apt-get install -y --no-install-recommends libgl1-mesa-dri libglx-mesa0 libegl-mesa0
      - run: npm run engines
      - run: npm run build
      - run: npm run app-check
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
      - run: npm run slice -- 300 4 inline
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
