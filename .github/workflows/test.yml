name: Test

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # Whether history's code has moved since the last deploy that passed. Where it has not, the checks
  # that only run history would say again what they said then, so they are passed over. Against the last
  # success, not the last push: a failed push's changes still count until a deploy has passed with them.
  moved:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    outputs:
      history: ${{ steps.diff.outputs.history }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha' || true)
          if [ -n "$base" ] && [ "$(node universe/tools/history-moved.mjs "$base")" = "false" ]; then
            echo "history=false" >> "$GITHUB_OUTPUT"
            echo "history's code is as it was at $base: its checks are passed over"
          else
            echo "history=true" >> "$GITHUB_OUTPUT"
            echo "history's code has moved since $base: its checks run"
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test

  universe:
    name: universe (tests ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node --test --test-concurrency=2 --test-shard=${{ matrix.shard }}/4 "tests/{*.test.ts,!(perf)/**/*.test.ts}"
      - if: matrix.shard == 1
        run: node --test --test-concurrency=1 "tests/perf/**/*.test.ts"
      - run: npm run build

  universe-history:
    needs: moved
    if: needs.moved.outputs.history == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      # The Phase 2 gate: eleven seeds, five hundred years each, every seed in its own process.
      - run: npm run gate:2
      # The Phase 3 gate: the Earth seed nine centuries — its turning points and numbers in
      # their bands, fuel only where deep time buried it, the north star on the industrial
      # planet, every year within budget and the save within bounds.
      - run: npm run gate:3

  universe-diversity:
    needs: moved
    if: needs.moved.outputs.history == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      # The Phase 4 gate's CI check: thirty open-prior worlds for a century and a half
      # (bodies, media, invention orders, houses, arms, growth, budgets), and a sea people
      # coming to power by the tides. The full gate (a hundred worlds, nine centuries) runs
      # locally: npm run gate:4.
      - run: npm run gate:4 -- --ci

  universe-sky:
    needs: moved
    if: needs.moved.outputs.history == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      # The Phase 5 gate's CI check: the Earth seed into its space age, its first satellite
      # in its band and its why naming the world's pull and the engine, within budget. The
      # full gate (colonies diverging, a heavy world and a light one) runs locally:
      # npm run gate:5.
      - run: npm run gate:5 -- --ci

  # Deep time: the Phase 6 gate without its clocks, the Earth seed and the costliest open world known
  # side by side, each to year 3100 (some half an hour on a runner): a ship among the stars, a colony
  # gone its own way, contact, a war between the stars, and the save within bound for its lands.
  # Saves are the same on every machine, so a store that starts to grow fails here; the time budgets
  # hold locally: npm run gate:6.
  universe-deep:
    needs: moved
    if: needs.moved.outputs.history == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      - run: npm run gate:6 -- --ci

  # The journey: every browser gate on the built app, shared out over fifteen runners side by side.
  # tools/ci-gates.ts holds what each gate walks, its CI arguments and its time on a runner; the
  # shards below are its `--plan 15`. A gate that fails runs once more (a runner's software GL and
  # slower clock make the odd timing miss); one failing twice fails its shard. Every gate in a shard
  # runs, whatever failed before it.
  universe-journey:
    name: universe-journey (gates ${{ matrix.gates }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        gates:
          - 7 40 62 65 67 68 96
          - 8 14 15 32 49 83 94
          - 9 13 17 42 55b 58 76
          - 10 20 52 75 88 92
          - 11 21 48 72 77 98
          - 12 24 26 45 81 99
          - 18 28 64 69 80 82
          - 19 25 30 43
          - 27 34 38 46 55 73
          - 29 36 39 50 53 78
          - 31 47 54 57 63 79 97
          - 33 56 66 69b 85 89
          - 35 44 51 61 84 86
          - 37 70 74 87 90 93
          - 41 60 71 91 95
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      # WebKit is also used by the names and brush journeys.
      - run: bash tools/install-browsers.sh chromium ${{ (contains(format(' {0} ', matrix.gates), ' 7 ') || contains(format(' {0} ', matrix.gates), ' 58 ') || contains(format(' {0} ', matrix.gates), ' 62 ')) && 'webkit' || '' }}
      - run: npm run build
      - run: node tools/ci-gates.ts ${{ matrix.gates }}
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
      # (A gate failing twice: the pictures of its second run's steps, kept.)
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ strategy.job-index }}
          path: universe/shots/
          if-no-files-found: ignore
          retention-days: 7

  universe-engines:
    needs: moved
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('universe/package-lock.json') }}
      - run: bash tools/install-browsers.sh chromium webkit firefox
      - run: sudo apt-get install -y --no-install-recommends libgl1-mesa-dri libglx-mesa0 libegl-mesa0
      - if: needs.moved.outputs.history == 'true'
        run: npm run engines
      - run: npm run build
      - run: npm run app-check
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
      - run: npm run stability-check
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
      - run: npm run body-check
      - run: npm run gore-check
      - run: npm run warfare-check
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
      # CI runners are about half as fast as the reference machine: 2× here is its 4×.
      - run: npm run slice -- 300 2
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
