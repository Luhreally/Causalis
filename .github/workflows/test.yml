name: Test

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test

  universe:
    name: universe (tests ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node --test --test-concurrency=2 --test-shard=${{ matrix.shard }}/4 "tests/{*.test.ts,!(perf)/**/*.test.ts}"
      - if: matrix.shard == 1
        run: node --test --test-concurrency=1 "tests/perf/**/*.test.ts"
      - run: npm run build

  universe-history:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      # The Phase 2 gate: eleven seeds, five hundred years each, every seed in its own process.
      - run: npm run gate:2
      # The Phase 3 gate: the Earth seed nine centuries — its turning points and numbers in
      # their bands, fuel only where deep time buried it, the north star on the industrial
      # planet, every year within budget and the save within bounds.
      - run: npm run gate:3

  universe-diversity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      # The Phase 4 gate's CI check: thirty open-prior worlds for a century and a half
      # (bodies, media, invention orders, houses, arms, growth, budgets), and a sea people
      # coming to power by the tides. The full gate (a hundred worlds, nine centuries) runs
      # locally: npm run gate:4.
      - run: npm run gate:4 -- --ci

  universe-sky:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      # The Phase 5 gate's CI check: the Earth seed into its space age, its first satellite
      # in its band and its why naming the world's pull and the engine, within budget. The
      # full gate (colonies diverging, a heavy world and a light one) runs locally:
      # npm run gate:5.
      - run: npm run gate:5 -- --ci

  # The journey: every browser gate on the built app, shared out over twelve runners side by side.
  # tools/ci-gates.ts holds what each gate walks, its CI arguments and its time on a runner; the
  # shards below are its `--plan 12`. A gate that fails runs once more (a runner's software GL and
  # slower clock make the odd timing miss); one failing twice fails its shard. Every gate in a shard
  # runs, whatever failed before it.
  universe-journey:
    name: universe-journey (gates ${{ matrix.gates }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gates:
          - 7 18 32 37 46
          - 8 24 34 61
          - 9 20 26 30 36 38
          - 10 21 53 54
          - 11 29 31 55
          - 12 14 19 33 55b
          - 13 25 41 43 56
          - 15 40 45 48 58
          - 17 42 60
          - 27 28 49 50 57
          - 35 47 51 62
          - 39 44 52
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      # WebKit is also used by the names and brush journeys.
      - run: npx playwright install --with-deps chromium ${{ (contains(format(' {0} ', matrix.gates), ' 7 ') || contains(format(' {0} ', matrix.gates), ' 58 ') || contains(format(' {0} ', matrix.gates), ' 62 ')) && 'webkit' || '' }}
      - run: npm run build
      - run: node tools/ci-gates.ts ${{ matrix.gates }}
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
      # (A gate failing twice: the pictures of its second run's steps, kept.)
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ strategy.job-index }}
          path: universe/shots/
          if-no-files-found: ignore
          retention-days: 7

  universe-engines:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: sudo apt-get install -y --no-install-recommends libgl1-mesa-dri libglx-mesa0 libegl-mesa0
      - run: npm run engines
      - run: npm run build
      - run: npm run app-check
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
      - run: npm run stability-check
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
      - run: npm run body-check
      - run: npm run gore-check
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
      # CI runners are about half as fast as the reference machine: 2× here is its 4×.
      - run: npm run slice -- 300 2
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
