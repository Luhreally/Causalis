name: Test

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test

  universe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # The Phase 2 gate: eleven seeds, five hundred years each, every seed in its own process.
      - run: npm run gate:2
      # The Phase 3 gate: the Earth seed nine centuries — its turning points and numbers in
      # their bands, fuel only where deep time buried it, the north star on the industrial
      # planet, every year within budget and the save within bounds.
      - run: npm run gate:3

  universe-diversity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      # The Phase 4 gate's CI check: thirty open-prior worlds for a century and a half
      # (bodies, media, invention orders, houses, arms, growth, budgets), and a sea people
      # coming to power by the tides. The full gate (a hundred worlds, nine centuries) runs
      # locally: npm run gate:4.
      - run: npm run gate:4 -- --ci

  universe-sky:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      # The Phase 5 gate's CI check: the Earth seed into its space age, its first satellite
      # in its band and its why naming the world's pull and the engine, within budget. The
      # full gate (colonies diverging, a heavy world and a light one) runs locally:
      # npm run gate:5.
      - run: npm run gate:5 -- --ci

  universe-journey:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run build
      # The Phase 7 gate's journey: the brief's journey walked at a phone's size in WebKit,
      # every step answered with its why (to the Earth seed's year 1450, its first war
      # between the stars fought). The phone's budgets need a GPU; they run locally:
      # npm run gate:7.
      - run: npm run gate:7 -- --sky-year 1450 --no-budgets
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
      # The Phase 8 gate's world: hunters and their game, a hunt run, a village's flock,
      # people carrying, a mine, another people's world visited, and the same history at
      # every setting. Its per-setting budgets run locally: npm run gate:8.
      - run: npx playwright install --with-deps chromium
      - run: npm run gate:8 -- --no-budgets
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
      # The Phase 9 gate: every beast a body of its own in a web of eating, a village's day
      # seen (its people kept out of its walls), its wars drawn, one zoom from a person to
      # the galaxy and back, and the genesis played through to where to begin. Its hand-over
      # timing needs a GPU; it runs locally: npm run gate:9.
      - run: npm run gate:9 -- --ci
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
      # The Phase 10 gate: everything a page, its numbers explained; tooltips; the political
      # map and its chrome (search, the outliner, the chronicle, the ledger); zoom both ways
      # toward the pointer, a battle seen from the globe to its village; go-to flights; free
      # roam walked and flown through the scales.
      - run: npm run gate:10 -- --ci
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
      # The Phase 11 gate: realms' arms on their pages and beside their names; hosts as
      # counters on the globe and in a land; a great happening in its window, the clock waiting
      # and the god's hand answering; realms side by side and a war's tally; the realms' map
      # closer, taken lands in shadow and sieges marked.
      - run: npm run gate:11 -- --ci
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
      # The Phase 12 gate: the god's palette (an act's reach lit and said, cast, playing where it
      # fell); the peoples in its hand (peace made and war set between two realms); the deeper
      # lenses and their tooltips; the world in numbers; armies seen on the globe and in a land;
      # the palette on a phone.
      - run: npm run gate:12 -- --ci
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
      # The Phase 13 gate: disasters from the palette (a quake, fire from the sky and its crater,
      # a river raised); makings (settlers, a blessing, two realms made one); a battle played out
      # in its land; a realm's army and a war's course.
      - run: npm run gate:13 -- --ci
        env:
          LIBGL_ALWAYS_SOFTWARE: 1

  universe-engines:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: sudo apt-get install -y --no-install-recommends libgl1-mesa-dri libglx-mesa0 libegl-mesa0
      - run: npm run engines
      - run: npm run build
      - run: npm run app-check
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
      # CI runners are about half as fast as the reference machine: 2× here is its 4×.
      - run: npm run slice -- 300 2
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
